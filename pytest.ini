[pytest]
# Owner: M4. Run from the repo root: `pytest`
pythonpath = .
testpaths = tests backend/ml
addopts = -ra --strict-markers
markers =
    models: exercises real ML models / external services (set RUN_MODEL_TESTS=1)
    m3_inflight: touches tables/pages M3's Postgres migration is changing (non-blocking in CI until Phase 1 lands)
filterwarnings =
    ignore::DeprecationWarning
